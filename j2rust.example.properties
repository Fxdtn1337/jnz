# J2Rust 构建样例。路径以此文件所在目录为基准。
# Windows 下可直接用正斜杠。
input=demo/SnakeGame.jar
output=out/SnakeGame-configured.jar
include=*
strict=false
native-backend=rust
targets=host

# 将选中的 class 分到若干 JNI 桥和原生模块。
jni-bridges=4
module-size=1M
shard-size=1M

# 先混淆选中的 Java 方法，再转换为 Rust。
pre-obfuscation=full
flow-profile=balanced
string-cipher=aes

# 需要查看源码或更容易定位错误时，保留构建产物。
work-dir=out/j2rust-config-build
report=out/j2rust-config-report.json

# 需要指定本地工具链时取消注释。
# rustc=out/tools/rust/bin/rustc.exe
# zig=tools/zig/zig.exe
